<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 11 Web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop"></div>
<div id="wins"></div>
<div id="start" class="hidden">
  <input id="q" class="sb" placeholder="Rechercher des applications, paramètres et documents" autocomplete="off">
  <h4>Épinglé</h4><div id="apps"></div>
  <h4>Recommandé</h4><div id="rec"></div>
  <div class="foot"><span>👤 Utilisateur</span><button id="off" title="Redémarrer">⏻</button></div>
</div>
<div id="cal" class="fly hidden"></div>
<div id="qs" class="fly hidden"></div>
<div id="bar">
  <div id="tasks">
    <button id="sbtn" title="Démarrer"><svg class="i" viewBox="0 0 24 24" fill="#4cc2ff"><rect x="2" y="2" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="2" width="9.5" height="9.5" rx="1"/><rect x="2" y="12.5" width="9.5" height="9.5" rx="1"/><rect x="12.5" y="12.5" width="9.5" height="9.5" rx="1"/></svg></button>
    <button id="sch" title="Rechercher"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg></button>
    <span id="run"></span>
  </div>
  <div id="tray">
    <button id="qsb" title="Réseau, son et batterie"><svg class="s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></svg><svg class="s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8"/></svg><svg class="s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10v4"/></svg></button>
    <button id="clock"></button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
